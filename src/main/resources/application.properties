# ===================================================================
# Configuración de Spring Boot - Zoo de Mascotas Fantásticas
# ===================================================================
spring.application.name=zoo-fantastico

# -------------------------------------------------------------------
# Configuración de Base de Datos MySQL
# Soporta variables de entorno del sistema con valores por defecto locales
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/zoo_fantastico?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Sc@20070708
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Configuración de Hibernate / JPA
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Desactivar Open-Session-In-View (OSIV) para forzar transacciones limpias
# y garantizar que las consultas de asociaciones se resuelvan en la capa de servicio
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Configuración del Servidor HTTP
# -------------------------------------------------------------------
server.port=${PORT:8080}
server.error.include-message=always
logging.level.org.hibernate.SQL=DEBUG